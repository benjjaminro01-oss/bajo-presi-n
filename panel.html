<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bajo Presión · PANEL DE CONTROL</title>
<style>
  body { margin:0; background:#06112B; color:#EDEDF4; font:15px/1.3 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:14px; }
  h1 { font-size:15px; letter-spacing:.12em; font-style:italic; margin:0 0 4px; } .sub { color:#8fa0cc; font-size:12px; margin-bottom:12px; }
  .g { background:#0A143E; border:1px solid #1c2d77; border-left:6px solid #288CFF; border-radius:10px; padding:10px; margin-bottom:10px; }
  .g.on { border-left-color:#e8453c; } .g b { display:block; margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; background:#050c24; border:1px solid #1c2d77; border-radius:6px; color:#fff; padding:10px; font-size:16px; font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  .b { display:grid; grid-template-columns:2fr 1fr; gap:8px; }
  button { font:inherit; font-weight:700; border:0; border-radius:8px; color:#fff; background:#0d6b3a; min-height:48px; cursor:pointer; }
  button.x { background:#5a1020; } #clr { width:100%; background:#16256b; margin-top:4px; }
  .st { font-size:12px; color:#f2b84b; margin-top:4px; min-height:14px; }
</style>
</head>
<body>
<h1>BAJO PRESIÓN · PANEL DE CONTROL</h1>
<div class="sub">Control de gráficas en vivo (el panel completo viene después). Sala: <span id="sala"></span> · modo: <span id="modo"></span></div>
<div id="lista"></div>
<button id="clr">Limpiar salida</button>

<script src="js/core.js?v=1"></script>
<script src="js/defaults.js?v=1"></script>
<script>
(function () {
  "use strict";
  var P = BP.params(), store = BP.createStore(P), cfg = BP.DEFAULT_CONFIG, $ = function (id) { return document.getElementById(id); };
  $("sala").textContent = store.sala; $("modo").textContent = store.mode;
  var gs = Object.keys(cfg.graficas).map(function (k) { return cfg.graficas[k]; }).sort(function (a, b) { return a.orden - b.orden; });
  var cards = {};
  gs.forEach(function (g) {
    var d = document.createElement("div"); d.className = "g";
    var html = "<b>" + g.nombre + " · " + g.tecla + "</b>";
    if (g.tipo === "gc_persona") { html += '<input type="text" placeholder="Nombre (hoy: ' + g.datos.nombre + ')" value="' + (/PENDIENTE_/.test(g.datos.nombre) ? "" : g.datos.nombre) + '">'; }
    html += '<div class="b"><button class="on">MOSTRAR</button><button class="x off">OCULTAR</button></div><div class="st"></div>';
    d.innerHTML = html; $("lista").appendChild(d); cards[g.id] = d;
    d.querySelector(".on").addEventListener("click", function () {
      var datos = BP.clone(g.datos), inp = d.querySelector("input");
      if (inp) { datos.nombre = inp.value.trim() || g.datos.nombre; }
      store.set("state/aire/" + g.capa, { gid: g.id, ts: Date.now(), datos: datos });
    });
    d.querySelector(".off").addEventListener("click", function () { store.remove("state/aire/" + g.capa); });
  });
  $("clr").addEventListener("click", function () { store.remove("state/aire"); });
  store.onChange(function (t) {
    var air = BP.getPath(t, "state/aire") || {}, est = BP.getPath(t, "state/estado") || {};
    gs.forEach(function (g) {
      var e = air[g.capa], on = !!(e && e.gid === g.id);
      cards[g.id].className = "g" + (on ? " on" : "");
      var s = est[g.capa], msg = "";
      if (s && s.gid === g.id && s.ok === false) { msg = "⚠ " + s.motivo; }
      cards[g.id].querySelector(".st").textContent = msg;
    });
  });
})();
</script>
</body>
</html>
